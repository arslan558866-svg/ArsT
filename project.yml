name: MoyFitnessPRO
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Создай себя"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID используется для защиты вашего тренировочного дневника."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.yourname.sozdaysebya
targets:
  MoyFitnessPRO:
    type: application
    platform: iOS
    sources:
      - path: MoyFitnessPRO
    settings:
      base:
        PRODUCT_NAME: "Создай себя"
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.sozdaysebya
        CODE_SIGN_STYLE: Automatic
    info:
      path: MoyFitnessPRO/Info.plist
      properties:
        CFBundleDisplayName: "Создай себя"
        NSFaceIDUsageDescription: "Face ID используется для защиты вашего тренировочного дневника."
